version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: homestay_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homestay
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - homestay_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homestay_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "mysql://root:root@db:3306/homestay"
      JWT_SECRET: f4d8a5e1c2b3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9
      JWT_EXPIRES_IN: 7d
      MIDTRANS_SERVER_KEY: SB-Mid-server-YOUR_KEY
      MIDTRANS_CLIENT_KEY: SB-Mid-client-YOUR_KEY
      MIDTRANS_IS_PRODUCTION: false
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 5242880
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - homestay_network
    command: npm run dev

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homestay_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_MIDTRANS_CLIENT_KEY: SB-Mid-client-YOUR_KEY
    volumes:
      - ./frontend/src:/app/src
    networks:
      - homestay_network
    depends_on:
      - backend
    command: npm run dev

  # Prisma Studio (optional - untuk melihat database)
  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homestay_prisma_studio
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/homestay"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - homestay_network
    command: npx prisma studio

volumes:
  mysql_data:

networks:
  homestay_network:
    driver: bridge
